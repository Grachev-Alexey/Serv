# Виви · nginx ВНУТРИ контейнера (HTTP на :80, доступен только через хостовый прокси).
# TLS терминирует хостовый nginx (см. deploy/vivi.host-nginx.conf).

# Для проброса WebSocket (/api/ws): Connection: upgrade только на upgrade-запросах.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Разрешаем большие сегменты/экспорт
    client_max_body_size 512m;

    # ─ Панель (SPA) ─
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─ API → бэкенд ─
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;             # WebSocket /api/ws
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # длинная выгрузка/экспорт
        proxy_buffering off;        # стримим экспорт и плейлисты без буферизации
    }

    # ─ HLS-сегменты и превью — статикой из тома, НО под авторизацией ─
    # Раньше видео/кадры отдавались всем по прямой ссылке (id + номер сегмента
    # перебираемы). Теперь каждый .ts/.jpg гейтится субзапросом к панели: без
    # валидной cookie-сессии — 401. Кэш приватный (не для общих прокси).
    location /hls/ {
        auth_request /_hls_auth;
        alias /srv/hls/;
        types {
            video/mp2t ts;
            image/jpeg jpg;
        }
        default_type application/octet-stream;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }

    # Внутренняя проверка доступа для /hls (не доступна снаружи).
    location = /_hls_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/hls-auth;
        proxy_pass_request_body off;            # тело не нужно — только заголовки
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;   # прокидываем cookie-сессию
        proxy_set_header Host $host;
        # Какой файл запрашивают — БЕЗ этого бэкенд не может проверить права на
        # конкретную камеру, и любой залогиненный тянет чужие записи по прямой
        # ссылке (device_id и номера сегментов перебираемы).
        proxy_set_header X-Original-URI $request_uri;
    }
}

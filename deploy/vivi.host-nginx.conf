# Виви · виртуалхост для ХОСТОВОГО nginx (НЕ контейнерного).
#
# Установка:
#   sudo cp deploy/vivi.host-nginx.conf /etc/nginx/sites-available/vivi-control.tw1.ru
#   sudo ln -s /etc/nginx/sites-available/vivi-control.tw1.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vivi-control.tw1.ru      # добавит TLS (443 + редирект) сам
#
# Наш docker-стек слушает 127.0.0.1:8080 — сюда и проксируем.

# Для WebSocket (/api/ws): Connection: upgrade только на upgrade-запросах.
# Уникальное имя, чтобы не конфликтовать с другими сайтами на этом nginx.
map $http_upgrade $vivi_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name vivi-control.tw1.ru;

    # Разрешаем большие загрузки/экспорт (иначе 413 на больших файлах)
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;             # WebSocket
        proxy_set_header Connection $vivi_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # длинная выгрузка/экспорт
        proxy_buffering off;        # стримим экспорт и плейлисты без буферизации
    }
}
